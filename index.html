<title>Envío automático de OC</title>
<!--
  MAQUETA INTERACTIVA — Envío automático de Purchase Order (OC) al proveedor
  Referencia funcional: "FLUJO DE COMPRAS ENVIO DE OC AUTOMATICO.pdf"

  Es un prototipo 100% front-end: no hay backend, base de datos, SAP, APIs ni envío real de correos.
  Todos los datos (proveedores, contactos, compras, OCs) son ficticios.

  Mapa de vistas vs. PDF
    Pág. 2  Suppliers (lista + General Information + Contacts + Evaluations)   -> vista "suppliers"
    Pág. 3  Purchasing > Settings > EMAIL BODY (Material/Asset/Services/Comex, English/Spanish,
            editor, sección gris condicional)                                   -> vista "settings" / tab "email"
    Pág. 4  Purchasing > Settings > MONTHLY CLOSING DATE (Month / Closing Date) -> vista "settings" / tab "closing"
    Pág. 5  Purchase ID: Paso 1 (ORDERS + abre carpeta del PC) y Paso 2 (IN TRANSIT) -> vista "purchase"
    Pág. 6  Paso 3: modal "Select Purchase Order to Send" + Continue             -> modal "select"
    Pág. 7  "Send Purchase Order": To, Cc, Subject, Message, Purchase Order, SEND -> modal "send"

  Decisiones tomadas donde el PDF/requerimiento es ambiguo (buscar "DECISIÓN" en el código):
    D1  El idioma del correo se toma del campo "Language" del proveedor (pág. 2) y puede cambiarse en el formulario.
    D2  La "Fecha Límite de Recepción" del cuerpo sale de Monthly Closing Date: día de cierre del mes en curso;
        si ya pasó, el del mes siguiente. Si el día no existe en el mes (ej. 30 de febrero) se usa el último día.
    D3  El destino "Es-Metals 1" se lee del campo "Delivery Location" de la compra (pág. 5). La regla
        (campo + valor) es parametrizable por tipo de compra en EMAIL BODY.
    D4  Cada OC cargada en ORDERS se asocia a un proveedor de la requisición. En "Select Purchase Order to Send" se elige UNA OC por envío;
        las demás quedan pendientes y se envían después con el mismo botón.
    D5  To: por defecto todos los contactos registrados del proveedor de la OC (se pueden quitar); el desplegable ofrece todos los
        contactos (primero los de proveedores de la requisición) y permite escribir un correo.
    D6  Cc: creador de la compra (Requested by) + comprador (Buyer) + WAREHOUSE@es-metals.com si el tipo es
        Material o Asset (regla del PDF, pág. 7).
    D7  El estado pasa a "In Transit" cuando se envía al menos una OC. Si quedan OCs pendientes, el botón
        IN TRANSIT permite enviarlas después.
    D8  Subject según pág. 7: "APROBACIÓN COTIZACIÓN C.I ES METALS//REQ.(n° req)//OC (n° OC)", editable por
        tipo/idioma en configuración.
-->

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Saira+Semi+Condensed:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1976d2; --primary-d:#115ea8; --primary-l:#e3eefa;
  --bg:#f4f4f4; --panel:#fff; --rail:#efefef; --line:#e0e0e0; --line2:#cfcfcf;
  --text:#212121; --muted:#6f6f6f; --muted2:#9e9e9e;
  --danger:#e53935; --ok:#2e7d32; --ok-l:#e8f5e9; --warn:#ed6c02; --warn-l:#fff4e5;
  --cond:#cbd3de; --cond-b:#9aa8bb;
  --radius:6px; --shadow:0 8px 28px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Roboto,system-ui,Segoe UI,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:currentColor;flex:none;vertical-align:middle}
.app{display:grid;grid-template-rows:1fr;grid-template-columns:minmax(0,1fr);min-height:100vh}

/* Header */
header.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fafafa;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:'Saira Semi Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px;color:#1d3557}
.logo .mark{width:22px;height:22px;border:2.5px solid #1d3557;position:relative;overflow:hidden}
.logo .mark:after{content:"";position:absolute;left:-4px;top:9px;width:34px;height:2.5px;background:#1d3557;transform:rotate(-45deg)}
.top .sp{flex:1}
.top-search{display:flex;align-items:center;gap:6px;border:1px solid #bdbdbd;border-radius:20px;padding:4px 12px;color:var(--muted2);width:220px;background:#fff}
.top-search input{border:0;outline:0;width:100%;background:none}
.iconbtn{background:none;border:0;padding:6px;border-radius:50%;color:#555;position:relative;display:inline-flex}
.iconbtn:hover{background:#0000000d}
.badge{position:absolute;top:0;right:0;background:var(--danger);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;line-height:16px}

/* Guide bar */
.guide{background:#fff;border-bottom:1px solid var(--line);padding:8px 20px 10px}
.guide-row{display:flex;align-items:center;gap:10px}
.guide-title{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.steps{display:flex;flex-wrap:wrap;gap:4px;overflow-x:auto;flex:1;min-width:0;padding:2px 0;scrollbar-width:thin}
.step{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fafafa;border-radius:16px;padding:3px 10px 3px 4px;font-size:12px;white-space:nowrap;color:var(--muted)}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e0e0e0;color:#555;font-size:11px}
.step.done{color:var(--ok)} .step.done b{background:var(--ok);color:#fff}
.step.cur{border-color:var(--primary);background:var(--primary-l);color:var(--primary);font-weight:500}
.step.cur b{background:var(--primary);color:#fff}
.step.nav{cursor:pointer} .step.nav:hover{border-color:var(--primary)}
.step-arrow{color:#bbb;font-size:11px;align-self:center}
.hint{margin-top:6px;font-size:13px;color:#37474f;display:flex;gap:8px;align-items:flex-start}
.hint svg{color:var(--primary);width:18px;height:18px;margin-top:1px}
.proto-tag{font-size:11px;background:var(--warn-l);color:#8a4b00;border:1px solid #ffd8a8;border-radius:4px;padding:2px 8px;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--primary);font-size:12px;padding:2px 4px;white-space:nowrap}
.linkbtn:hover{text-decoration:underline}

/* Body */
.main{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:0}
nav.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-right:1px solid var(--line)}
.rail .brand{font-size:8px;font-weight:700;color:#9e9e9e;letter-spacing:.3px;margin-bottom:8px}
.rail button{width:44px;height:44px;border:0;border-radius:8px;background:none;color:#616161;display:grid;place-items:center;position:relative}
.rail button:hover{background:#00000010}
.rail button.on{color:var(--primary);background:#fff;box-shadow:0 1px 3px #0001}
.rail .tip{position:absolute;left:52px;background:#424242;color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;z-index:5}
.rail button:hover .tip{opacity:1}
.rail .grow{flex:1}
.content{padding:16px 20px;min-width:0}
footer{display:flex;justify-content:space-between;padding:6px 20px;font-size:12px;color:#555;background:#fafafa;border-top:1px solid var(--line)}

/* Generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.tabs{display:flex;background:#eaeaea;border-radius:var(--radius) var(--radius) 0 0}
.tab{border:0;background:none;padding:12px 20px;font-size:13px;font-weight:600;letter-spacing:.6px;color:#8a8a8a;text-transform:uppercase;font-family:'Open Sans',Roboto,sans-serif}
.tab.on{background:#fff;color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:20px;padding:7px 18px;font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-d)}
.btn:disabled{background:#e0e0e0;color:#a0a0a0;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.ghost:hover{background:var(--primary-l)}
.btn.grey{background:#e0e0e0;color:#757575}
.btn.lg{padding:10px 26px;font-size:15px}
.btn.sm{padding:4px 12px;font-size:11px}
.btn.ok{background:var(--ok)}
.fab{width:30px;height:30px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:inline-grid;place-items:center;flex:none}
.fab:hover{background:var(--primary-d)} .fab svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:16px;background:#eee;padding:3px 10px;font-size:12px;max-width:100%}
.chip .x{border:0;background:#9e9e9e;color:#fff;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;padding:0;flex:none}
.chip .x svg{width:12px;height:12px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:12px;padding:2px 10px;white-space:nowrap}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-approved{background:#e3f2fd;color:#1565c0}
.st-transit{background:var(--ok-l);color:var(--ok)}
.st-pending{background:var(--warn-l);color:#a85500}
.st-sent{background:var(--ok-l);color:var(--ok)}
.muted{color:var(--muted)} .small{font-size:12px}
.toggle{position:relative;width:34px;height:18px;flex:none;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#cfcfcf;border-radius:9px;transition:.15s;cursor:pointer}
.toggle span:before{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:.15s}
.toggle input:checked+span{background:#90caf9}
.toggle input:checked+span:before{transform:translateX(16px);background:var(--primary)}
.avatar{width:32px;height:32px;border-radius:50%;background:#e8e8e8;display:inline-grid;place-items:center;font-weight:700;font-size:12px;color:#333;flex:none}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;font-weight:600;color:#555;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafafa;white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid #eee;vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f5f9fe}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--primary-l);border:1px solid #bbd5f3;color:#0d3c6e;border-radius:var(--radius);padding:10px 12px;font-size:13px}
.callout svg{color:var(--primary);margin-top:1px}
.callout.warn{background:var(--warn-l);border-color:#ffd8a8;color:#663c00} .callout.warn svg{color:var(--warn)}
.flag{display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;vertical-align:middle;box-shadow:0 0 0 1px #0002;flex:none}
.flag.es{background:linear-gradient(#fcd116 0 50%,#003893 50% 75%,#ce1126 75%)}
.flag.en{background:linear-gradient(90deg,#3c3b6e 0 45%,transparent 45%),repeating-linear-gradient(#b22234 0 2.6px,#fff 2.6px 5.2px)}
.flag.en{background:linear-gradient(#3c3b6e,#3c3b6e) 0 0/45% 54% no-repeat,repeating-linear-gradient(#b22234 0 3.1px,#fff 3.1px 6.2px)}

.flag.co{background:linear-gradient(#fcd116 0 50%,#003893 50% 75%,#ce1126 75%)}
.flag.us{background:linear-gradient(#3c3b6e,#3c3b6e) 0 0/45% 54% no-repeat,repeating-linear-gradient(#b22234 0 3.1px,#fff 3.1px 6.2px)}
.flag.mx{background:linear-gradient(90deg,#006847 0 33.3%,#fff 33.3% 66.6%,#ce1126 66.6%)}
.flag.esp{background:linear-gradient(#aa151b 0 25%,#f1bf00 25% 75%,#aa151b 75%)}
.cchip{border:0;background:none;padding:2px 4px 2px 0;border-radius:18px;cursor:pointer;color:var(--text);font-family:inherit}
.cchip:hover{background:#eef3fb;color:var(--primary)}
/* Contact Information (ventana de la aplicación) */
.modal.cinfo{width:min(560px,100%)}
.ci-head{display:flex;align-items:center;gap:14px;padding:18px 20px 0}
.ci-head h3{margin:0;font-size:24px;font-weight:500;flex:1}
.ci-head .close{border:0;background:none;color:var(--primary);display:flex;padding:2px}
.ci-head .close svg{width:24px;height:24px}
.ci-act{color:var(--primary)} .ci-act svg{width:24px;height:24px}
.ci-avatar{display:grid;place-items:center;margin:-8px 0 14px;color:var(--primary)}
.ci-avatar svg{width:118px;height:118px}
.ci-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 26px}
.ci-f{display:flex;align-items:flex-end;gap:10px;min-width:0}
.ci-f.full{grid-column:1/-1}
.ci-f>svg{color:#9e9e9e;width:22px;height:22px;margin-bottom:6px}
.ci-f label{flex:1;min-width:0;display:block}
.ci-f label span{display:block;font-size:10px;color:#777;min-height:13px}
.ci-f input{width:100%;border:0;border-bottom:1px dashed #9e9e9e;padding:4px 0 6px;font-size:16px;color:#8a8a8a;outline:0;background:none}
.ci-f select{border:0;background:none;font-size:12px;color:#777;width:20px;padding:0;margin-bottom:8px;cursor:pointer}
.ci-f select:disabled{cursor:default;opacity:.8}
.ci-f.cphone .flag{width:24px;height:16px;border-radius:2px;margin-bottom:8px}
.editing .ci-f input{border-bottom:1px solid #757575;color:var(--text)}
.editing .ci-f input:focus{border-bottom:2px solid var(--primary)}
@media (max-width:640px){ .ci-grid{grid-template-columns:1fr} }

/* Pestaña de compra abierta + detalle */
.purtabs .rtab{display:inline-flex;align-items:center;gap:8px;color:#888}
.purtabs .rtab.on{color:var(--primary)}
.purtabs .rtab .tx{display:inline-flex;border-radius:50%;padding:2px;color:#999}
.purtabs .rtab .tx:hover{background:#0001;color:#333}
.purtabs .rtab .tx svg{width:16px;height:16px}
.pdet{background:#fff;padding:0 16px 16px}
.pdet .po-head{padding:14px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pdet .po-head h2{font-size:26px;font-weight:700}
.frow{display:grid;gap:14px 22px;padding:12px 4px 4px}
.frow.r5{grid-template-columns:.9fr 1.3fr 1.3fr .9fr 1fr}
.frow.r3{grid-template-columns:minmax(0,1fr) 2fr}
.f .val,.f select,.f input,.f textarea{font-size:17px}
.f textarea{display:block;width:100%;border:0;background:none;padding:3px 0 5px;outline:0;resize:vertical;font-family:inherit}
.condnote{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 4px 0 calc(66%)}
.docgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 26px;padding:14px 4px 4px;align-items:center}
.docgrid .lb{font-weight:500;font-size:16px;color:#333}
.docgrid .orders-box{padding:4px 8px;margin:-4px -8px}
.pdet .items{margin:24px 0 0;background:#efefef;border-radius:0}
.pdet .items .cap{display:flex;justify-content:space-between;align-items:center;padding:30px 22px 18px;font-size:16px;font-weight:500}
.pdet .items .cap .btn.lg{border-radius:24px;box-shadow:0 2px 4px #0003}
table.it th{background:transparent;color:#333;font-size:14px;font-weight:700;padding:12px 14px;border-bottom:1px solid #ccc}
table.it .irow td{background:#efefef;font-size:16px;padding:6px 14px;border-bottom:1px solid #ddd}
table.it .c{text-align:center} table.it .nw{white-space:nowrap}
table.it .irow td b{font-weight:500}
table.it .qrow td{background:#fff;padding:18px 44px;border-bottom:1px solid #ddd}
.qbox{border:1px solid #e3e3e3;border-radius:4px}
.qbox table.t th{background:#fff;color:#444;font-size:13px;font-weight:700;padding:14px 12px;text-align:left;white-space:normal}
.qbox table.t td{font-size:15px;padding:14px 12px;border:0}
.qbox .c{text-align:center}
.qchk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:3px;background:#9e9e9e;color:#fff}
.qchk svg{width:16px;height:16px}
.pdet .items .total{padding:16px 20px;font-size:16px;font-weight:700;border-top:1px solid #ddd}
.pdet .actions{padding:18px 4px}
.pdet .log{margin:4px 0 8px}
@media (max-width:1100px){ .frow.r5{grid-template-columns:1fr 1fr} .docgrid{grid-template-columns:1fr} .condnote{padding-left:4px} }
@media (max-width:640px){ .frow.r5,.frow.r3{grid-template-columns:1fr} .pdet{padding:0 12px 12px} table.it .qrow td{padding:10px} }

.btn.danger{background:#e53935;color:#fff;box-shadow:0 2px 4px #0003} .btn.danger:hover{background:#c62828}
.btn.off{background:#e0e0e0;color:#a0a0a0;box-shadow:none}
.ochip .fx{border:0;background:#616161;color:#fff;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;padding:0}
.ochip .fx svg{width:12px;height:12px}
.pdet .ochip{border:0;background:#eef1f5;padding:3px 8px}
/* Ventana "Purchase Order" del ítem */
.modal.pom{width:min(520px,100%)}
.pom .mh{border-bottom:0;padding-bottom:6px}
.pom .mh h3{font-size:20px}
.pom-f{display:flex;align-items:flex-end;gap:12px;margin:0 0 22px}
.pom-f>svg{color:#555;margin-bottom:6px}
.pom-f label{flex:1;display:block}
.pom-f label span{display:block;font-size:10px;color:#777;min-height:12px}
.pom-f input,.pom-f textarea{width:100%;border:0;border-bottom:1px solid #9e9e9e;padding:4px 0 6px;font-size:15px;outline:0;font-family:inherit;background:none}

/* Secciones condicionales (Purchasing › Settings › Email body) */
.condshead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 8px;flex-wrap:wrap}
.condshead h4{margin:0 0 2px;font-size:14px}
.condbox{margin-bottom:12px}

.condbar .cname:hover{border-bottom-color:#8796ab}

.condlocs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px dashed var(--cond-b);font-size:12px;color:#1f2d3d}

.lchip.on svg{display:inline}
.condempty{border:1px dashed #ccc;border-radius:4px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.editor:empty:before{content:attr(data-ph);color:#90a4ae}

table.ct input.cdate{width:100%;text-align:left;border:1px solid transparent;border-radius:3px;padding:3px 6px;font:inherit;background:transparent;cursor:pointer}

table.ct input.cdate:focus{border-color:var(--primary);background:#fff;outline:0}

/* Condicional compartido: tabla compacta y neutral */
.ctitle{font-weight:700;font-size:14px;margin:24px 0 6px}
.ctab{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--line)}
.ctab th{text-align:left;font-size:11px;font-weight:600;color:#666;padding:8px 10px;border-bottom:1px solid var(--line)}
.ctab td{padding:9px 10px;border-bottom:1px solid #eee;vertical-align:middle}
.ctab tr.off td:not(:nth-child(3)){color:#9e9e9e}
.cprev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.locsum{white-space:nowrap}
.cstate{display:inline-flex;align-items:center;gap:8px;cursor:pointer}

.sp-f{border-bottom:1px solid #9e9e9e;padding:8px 0 2px;margin-bottom:10px;position:relative}

.sp-f.cc .chipfield{min-height:70px;align-content:flex-start}
.sendpo .chipfield{min-height:30px;padding:2px 24px 2px 0}
.sendpo .chipfield input{min-width:120px;font-size:13px}
.sendpo .ec{background:#eef1f5;border:0;border-radius:14px;padding:2px 4px 2px 10px;font-size:12px}

.sp-att{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 4px}

.sp-file{border:1px solid #ccc;border-radius:4px;font-size:12px;padding:2px 4px;max-width:200px}
.sp-foot{display:flex;justify-content:flex-end;padding:8px 22px 18px}
.sp-foot .btn{padding:6px 20px;font-size:13px}

/* Purchases list (pantalla Requests de la aplicación) */
.pur{margin:-16px -20px 0}
.purtabs{display:flex;background:#e2e2e2;overflow-x:auto;padding-left:40px;scrollbar-width:thin}
.purtabs button{border:0;background:none;padding:16px 18px;font-size:15px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:#c4c4c4;white-space:nowrap}
.purtabs button:hover{color:#999}
.purtabs button.on{background:#f4f4f4;color:var(--primary)}
.purbox{background:#fff;margin:8px 16px 0;border:1px solid var(--line);border-radius:4px}
.purbar{display:flex;align-items:center;gap:12px;padding:30px 16px 20px;background:#efefef;flex-wrap:wrap}
.purseg{display:flex;background:#f6f6f6;border-radius:4px;overflow:hidden}
.purseg button{border:0;background:none;padding:11px 14px;font-size:14px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:#333}
.purseg button.on{background:#dcdcdc}
.purbar .btn.lg{border-radius:24px;padding:11px 22px;box-shadow:0 2px 4px #0003}

.pill{display:inline-block;border-radius:18px;padding:6px 14px;color:#fff;font-size:17px;font-weight:500;white-space:nowrap;line-height:1.3}

.p-blue{background:var(--primary)} .p-green{background:#43a047} .p-transit{background:#00897b}
.purfoot{display:flex;justify-content:flex-end;align-items:center;gap:36px;padding:14px 24px;font-size:13px;color:#333}
.purfoot span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:640px){ .pur{margin:-12px -16px 0} .purtabs{padding-left:0} .purbox{margin:8px 0 0} table.pt td{font-size:13px} .pill{font-size:13px} }

/* Suppliers */
.split{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:560px}
.split>.left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.searchrow{display:flex;gap:10px;align-items:center;padding:14px 16px 8px}
.pill-input{flex:1;display:flex;align-items:center;gap:8px;background:#eee;border-radius:20px;padding:7px 14px;color:#777}

.filterrow{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px;border-bottom:1px solid var(--line);font-size:11px;color:#555}

.suplist{overflow:auto;flex:1;max-height:640px}
.sup{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.sup:hover{background:#f7f7f7}
.sup.on{background:#e3eefa}
.sup .bico{width:42px;height:42px;border-radius:50%;background:#757575;color:#fff;display:grid;place-items:center;flex:none}
.sup .nm{font-size:14px;color:#333;text-transform:uppercase}
.sup.on .nm{color:var(--primary)}
.sup .ct{font-size:12px;color:#666;display:flex;align-items:center;gap:4px;margin-top:3px}
.sup .ct svg{width:15px;height:15px}
.sup .cnt{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.detail{padding:14px 18px;min-width:0}
.dhead{display:flex;align-items:center;gap:12px;padding:12px 4px 14px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:19px;font-weight:500}
.dhead .ico{color:#9e9e9e}
.infogrid{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;padding:16px 4px;font-size:13px;border-bottom:1px solid var(--line)}
.infogrid .k{color:#555}
.cchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cchip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
.cchip .avatar{width:28px;height:28px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 4px 8px}
.sectionhead h3{margin:0;font-size:16px;font-weight:600}
.evals{margin-top:18px;background:#f0f0f0;border-radius:var(--radius);padding:12px}
.evals h3{margin:4px 6px 10px;font-size:22px;font-weight:700}

/* Settings */
.settings{display:grid;grid-template-columns:260px 1fr;gap:16px}
.setnav{padding:10px}
.setnav .grp{border:1px solid var(--line2);border-radius:4px;padding:10px 12px}
.setnav .grp h4{margin:0 0 6px;font-weight:400;font-size:16px;font-family:'Open Sans',sans-serif}
.setnav .it{display:flex;align-items:center;gap:6px;font-size:13px;color:#333;padding:3px 8px;border-radius:4px;background:var(--primary-l)}
.setnav .it svg{width:15px;height:15px}
.typerow{display:flex;flex-wrap:wrap;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;font-family:'Open Sans',sans-serif}
.typerow label{display:flex;align-items:center;gap:6px;cursor:pointer}
.typerow input{accent-color:var(--primary)}
.cfghead{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.cfghead h3{margin:0;font-family:'Open Sans',sans-serif;font-size:16px;font-weight:700;letter-spacing:.3px}
.langtabs{display:flex;justify-content:flex-end;gap:4px;padding:10px 18px 0}
.langtabs button{border:0;background:none;padding:8px 12px;font-size:12px;font-weight:700;color:#777;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.langtabs button.on{color:var(--primary);border-color:var(--primary)}
.langtabs .flag{width:16px;height:16px}
.cfgbody{display:grid;grid-template-columns:1fr 250px;gap:18px;padding:12px 18px 20px}
.subjrow label{display:block;font-size:11px;color:#777}
.subjrow .inp{width:100%;border:0;border-bottom:1px solid #949494;padding:6px 0;outline:0;font-weight:600;font-family:'Open Sans',sans-serif;font-size:13px}
.subjrow .inp:focus{border-bottom:2px solid var(--primary)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 4px;border-bottom:1px solid var(--line);margin-top:14px}
.toolbar button{border:0;background:none;min-width:28px;height:28px;border-radius:4px;color:#444;font-weight:700;font-size:14px}
.toolbar button:hover{background:#eee}
.toolbar select{border:0;background:none;font-size:12px;padding:4px}
.toolbar .sep{width:1px;height:18px;background:#ddd;margin:0 4px}
.editor{min-height:120px;padding:12px 6px;outline:0;font-family:'Open Sans',sans-serif;font-size:13px;line-height:1.55}
.editor:focus{background:#fcfdff}
.editor ul{margin:6px 0;padding-left:22px}
.editor p{margin:0 0 8px}
.var{display:inline-block;background:#e8f0fe;color:#1a56b8;border:1px solid #b6cdf5;border-radius:4px;padding:0 5px;font-family:Consolas,monospace;font-size:12px;line-height:18px;white-space:nowrap}
.condbox{background:var(--cond);border:1px dashed var(--cond-b);border-radius:4px;margin-top:6px}
.condbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:#b9c4d3;font-size:12px;color:#1f2d3d;border-radius:4px 4px 0 0}
.condbar select{border:1px solid #8796ab;border-radius:4px;padding:2px 6px;background:#fff;font-size:12px}
.condbar .lbl{font-weight:700;display:flex;align-items:center;gap:6px}
.condbox .editor{background:transparent}
.condbox.off{opacity:.55}
.varpanel{border-left:1px solid var(--line);padding-left:16px}
.varpanel h4{margin:0 0 6px;font-size:13px}
.varpanel .vlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.varpanel .vlist button{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.varpanel .vlist button:hover .var{background:#d4e3fd}
.varpanel .vlist small{color:var(--muted);font-size:11px}
.closing-wrap{padding:18px;max-width:460px}
table.ct{border-collapse:collapse;width:100%;font-family:'Open Sans',sans-serif;font-size:13px}
table.ct th{background:#e6e6e6;border:1px solid #cfcfcf;padding:6px 10px;font-size:12px}
table.ct td{border:1px solid #d8d8d8;padding:3px 10px}
table.ct tr.cur td{background:#e3eefa}
table.ct input{width:64px;border:1px solid transparent;border-radius:3px;padding:3px 6px;text-align:right;background:transparent;outline:0}
table.ct input:hover{border-color:#ccc;background:#fff}
table.ct input:focus{border-color:var(--primary);background:#fff}
table.ct input.bad{border-color:var(--danger);background:#fdecea}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:#fafafa}
.kpi .v{font-size:22px;font-weight:700;color:var(--primary);margin:4px 0}

/* Purchases */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pagehead h1{margin:0;font-size:20px;font-weight:500}
.po-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.po-head h2{margin:0;font-size:20px;font-weight:700}
.po-head .x{color:var(--primary)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.8fr);gap:14px 26px;padding:16px 20px}
.f{display:flex;align-items:flex-end;gap:8px;min-width:0}
.f>svg{color:#555;margin-bottom:6px}
.f .fi{flex:1;min-width:0;border-bottom:1px solid #949494}
.f label{display:block;font-size:10px;color:#777;line-height:1.2}
.f .val,.f select,.f input{display:block;width:100%;border:0;background:none;padding:3px 0 5px;font-size:14px;outline:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f select{cursor:pointer}
.f.hl .fi{border-bottom:2px solid var(--warn)}
.f .tag{font-size:10px;color:#a85500;margin-top:3px;display:block}
.docrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:4px 20px 14px}
.docs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.docs .lb{font-weight:700;font-size:12px}
.doclink{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-size:12px;text-decoration:underline;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doclink svg{width:15px;height:15px}
.orders-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px solid transparent;border-radius:6px;padding:6px 8px}
.ochip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px 4px 8px;background:#fff;font-size:12px}
.ochip select{border:1px solid #ddd;border-radius:4px;font-size:12px;padding:1px 4px;max-width:180px}
.items{background:#ececec;margin:6px 20px 0;border-radius:4px}
.items .cap{padding:16px 14px 6px;font-weight:700;font-size:12px}
.items table.t th{background:transparent;color:#444;border-bottom:0}
.items table.t td{border-bottom:1px solid #dcdcdc;background:#fff}
.items .total{padding:12px 14px;text-align:right;font-weight:700;font-size:13px}
.actions{display:flex;justify-content:space-between;align-items:center;padding:20px;gap:10px;flex-wrap:wrap}
.transit-wrap{display:flex;align-items:center;gap:10px;border:1.5px solid transparent;border-radius:24px;padding:3px}
.log{margin:4px 20px 20px}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(20,24,30,.42);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:8px;box-shadow:var(--shadow);width:min(480px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.lg{width:min(1120px,100%)}
.modal.md{width:min(640px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:17px;font-weight:700;font-family:'Open Sans',sans-serif;flex:1}
.mh .close{border:0;background:none;color:var(--primary);padding:2px;display:flex}
.mb{padding:16px 20px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.mf .left{margin-right:auto}
.frm{display:grid;gap:12px}
.frm label{font-size:12px;color:#555;display:grid;gap:4px}
.frm input[type=text],.frm input[type=email],.frm select{border:1px solid #c8c8c8;border-radius:4px;padding:8px 10px;outline:0}
.frm input:focus,.frm select:focus{border-color:var(--primary)}
.frm .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:12px}

/* File picker (Windows-like) */
.picker{width:min(760px,100%)}
.pk-path{display:flex;align-items:center;gap:6px;font-size:12px;color:#333;background:#f5f5f5;border:1px solid #ddd;border-radius:4px;padding:6px 10px;margin-bottom:10px}
.pk-grid{display:grid;grid-template-columns:160px 1fr;border:1px solid #ddd;border-radius:4px;min-height:260px}
.pk-side{background:#fafafa;border-right:1px solid #ddd;padding:8px;font-size:12px}
.pk-side div{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:4px;color:#444}
.pk-side div.on{background:#dbe9f8}
.pk-side svg{width:16px;height:16px;color:#e9b33b}
.pk-list table.t td{padding:6px 10px;cursor:pointer}
.pk-list tr.sel td{background:#cce4f7}
.pk-list .fic{color:#d32f2f;width:18px;height:18px}

/* Select PO */
.selbox{border:1px solid #333;border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin:6px 0 0;background:#fff}
.sellist{border:1px solid var(--line2);border-top:0;border-radius:0 0 8px 8px;max-height:260px;overflow:auto}
.selitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}
.selitem:hover{background:#f6f9fd}
.selitem input{margin-top:3px;accent-color:var(--primary);width:16px;height:16px}
.selitem .po{font-weight:700}
.selitem.disabled{opacity:.55;cursor:not-allowed}

/* Send form */
.sendgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:0}
.sendform{padding:4px 20px 16px;min-width:0}
.why{background:#f7f9fc;border-left:1px solid var(--line);padding:14px 16px;font-size:12.5px;min-width:0}
.why h4{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:6px}
.rule{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 10px;margin-bottom:9px}
.rule .rt{font-weight:700;font-size:12px;margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.rule .rd{color:#455a64}
.rule ul{margin:4px 0 0;padding-left:16px}
.rule li.no{color:#9e9e9e;text-decoration:line-through}
.rule select{border:1px solid #bbb;border-radius:4px;padding:3px 6px;font-size:12px;width:100%;margin-top:6px}
.rule.cond{border-color:var(--cond-b);background:#eef1f5}
.seg{display:inline-flex;border:1px solid var(--primary);border-radius:14px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--primary);font-size:11px;font-weight:700;padding:3px 10px}
.seg button.on{background:var(--primary);color:#fff}
.inc{font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
.inc.yes{background:var(--ok-l);color:var(--ok)} .inc.no{background:#eceff1;color:#607d8b}
.potabs{display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.potab{border:1px solid var(--line);border-bottom:0;background:#f5f5f5;border-radius:6px 6px 0 0;padding:7px 12px;font-size:12px;color:#555;display:flex;align-items:center;gap:6px}
.potab.on{background:#fff;color:var(--primary);font-weight:700;border-color:var(--primary);position:relative;top:1px}
.mfield{border-bottom:1px solid #9e9e9e;padding:10px 0 4px;position:relative}
.mfield.boxed{border:1px solid transparent}
.mfield>label{font-size:10.5px;color:#777;display:flex;justify-content:space-between;gap:6px}
.mfield>label .src{color:var(--primary);font-size:10.5px}
.chipfield{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px;padding:4px 26px 4px 0;cursor:text;position:relative}
.chipfield input{border:0;outline:0;min-width:160px;flex:1;padding:4px 0;font-size:13px}
.chipfield .caret{position:absolute;right:0;top:8px;color:#666;border:0;background:none;padding:0}
.ec{display:inline-flex;align-items:center;gap:6px;background:#eef3fb;border:1px solid #d3e1f5;border-radius:16px;padding:2px 4px 2px 3px;font-size:12px;max-width:100%}
.ec .avatar{width:20px;height:20px;font-size:9px;background:#c7dbf5;color:#0d47a1}
.ec .em{color:#555}
.ec .why-tag{font-size:10px;color:#fff;background:#78909c;border-radius:8px;padding:0 6px}
.ec .x{border:0;background:none;color:#777;padding:0 2px;display:flex}
.ec .x svg{width:14px;height:14px}
.ec.typed{background:#fff8e1;border-color:#ffe082}
.dd{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);z-index:20;max-height:300px;overflow:auto}
.dd .g{font-size:10.5px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.4px;padding:8px 12px 4px;background:#fafafa;border-bottom:1px solid #eee;position:sticky;top:0}
.dd .o{display:grid;grid-template-columns:18px minmax(0,auto) minmax(0,1fr) auto;gap:10px;align-items:center;justify-items:start;padding:7px 12px;cursor:pointer;font-size:13px;text-align:left}
.dd .o b,.dd .o .em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dd .o:hover{background:#f1f6fd}
.dd .o input{accent-color:var(--primary)}
.dd .o .em{color:#777;font-size:12px}
.dd .o .sp{margin-left:auto;font-size:11px;color:var(--muted)}
.subj{width:100%;border:0;outline:0;font-weight:700;font-family:'Open Sans',sans-serif;font-size:13px;padding:4px 0}
.msg{min-height:220px;padding:10px 2px;outline:0;font-family:'Open Sans',sans-serif;font-size:13px;line-height:1.55}
.msg ul{margin:6px 0;padding-left:22px}
.msg p{margin:0 0 8px}
.cond-sec{background:var(--cond);border-radius:4px;padding:8px 12px 10px;margin-top:10px;position:relative;border:1px solid var(--cond-b)}
.cond-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:#fff;background:#5c6f88;border-radius:10px;padding:1px 9px;margin-bottom:6px;font-family:Roboto,sans-serif;user-select:none}
.cond-omit{border:1px dashed #b0bec5;color:#78909c;border-radius:4px;padding:8px 12px;margin-top:10px;font-size:12px;font-family:Roboto,sans-serif;background:repeating-linear-gradient(45deg,#fafafa 0 8px,#f2f4f6 8px 16px);user-select:none}
.attach{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 4px}
.attach .lb{font-weight:700;color:#777;font-size:13px}
.filecard{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:12px;background:#fff}
.filecard svg{color:#d32f2f}
.review-item{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.review-item h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rgrid{display:grid;grid-template-columns:90px 1fr;gap:5px 10px;font-size:12.5px}
.rgrid .k{color:#777}
.success-ico{width:60px;height:60px;border-radius:50%;background:var(--ok-l);color:var(--ok);display:grid;place-items:center;margin:4px auto 10px}
.success-ico svg{width:34px;height:34px}
.sent-line{border:1px solid #c8e6c9;background:#f6fbf6;border-radius:6px;padding:10px 12px;margin-bottom:10px}
.sent-line p{margin:0 0 6px;font-weight:500}
.flowchg{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px}
.spinner{width:36px;height:36px;border:4px solid #e3eefa;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
#toasts{position:fixed;right:16px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:999}
.toast{background:#323232;color:#fff;border-radius:6px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);max-width:380px;display:flex;gap:8px;align-items:flex-start}
.toast.ok{background:#1b5e20} .toast.warn{background:#8a4b00}
.toast svg{width:18px;height:18px}

/* Responsive */
@media (max-width:1100px){
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cfgbody{grid-template-columns:1fr}
  .varpanel{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}
  .varpanel .vlist{flex-direction:row;flex-wrap:wrap}
  .sendgrid{grid-template-columns:1fr}
  .why{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .split{grid-template-columns:1fr}
  .split>.left{border-right:0;border-bottom:1px solid var(--line)}
  .suplist{max-height:260px}
  .settings{grid-template-columns:1fr}
  .closing-wrap{grid-template-columns:1fr}
  .top-search{display:none}
  .steps{flex-wrap:nowrap}
}
@media (max-width:640px){
  header.top{padding:8px 16px}
  .logo{font-size:18px}
  .guide{padding:8px 16px}
  .main{grid-template-columns:52px minmax(0,1fr)}
  .rail button{width:40px;height:40px}
  .content{padding:12px 16px}
  .fgrid{grid-template-columns:1fr;padding:12px 16px}
  .docrow,.po-head,.actions{padding-left:16px;padding-right:16px}
  .items{margin:6px 16px 0}
  .log{margin:4px 16px 16px}
  .infogrid{grid-template-columns:110px 1fr}
  .frm .row2{grid-template-columns:1fr}
  .pk-grid{grid-template-columns:1fr}.pk-side{display:none}
  footer{flex-direction:column;gap:2px;padding:6px 16px}
  .proto-tag{display:none}
}

function closingDeadline(from = new Date()){
  let y = from.getFullYear(), m = from.getMonth();
  const at = (y,m) => new Date(y, m, Math.min(S.closing[m], dim(y,m)));
  let d = at(y,m);
  const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  if (d < today){ m++; if (m > 11){ m = 0; y++; } d = at(y,m); }
  return d;
}
const fmtDate = (d, lang) => lang === 'es'
  ? `${cap(DAYS_ES[d.getDay()])}, ${d.getDate()} de ${cap(MONTHS_ES[d.getMonth()])} de ${d.getFullYear()}`
  : `${DAYS_EN[d.getDay()]}, ${MONTHS_EN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const nowStr = () => { const d = new Date(); const p = n => String(n).padStart(2,'0');

}

}

}

}

function defaultCc(r){
  const list = [
    {email:USERS[r.requestedBy].email, reason:'Creador'},

  ];
  if (r.type === 'Material' || r.type === 'Asset') list.push({email:WAREHOUSE, reason:'Material/Activo'});
  const seen = new Set();
  return list.filter(x => !seen.has(x.email) && seen.add(x.email));
}
/* Órdenes de compra de la requisición.
   El usuario ingresa el número de OC en cada ítem (flecha de ACTION) y carga los archivos en ORDERS.
   Las OCs a enviar se arman agrupando los ítems por número de OC; el proveedor es el de la cotización del ítem.
   DECISIÓN D4: el adjunto de cada OC es el archivo de ORDERS cuyo nombre contiene el número de OC; si ninguno
   coincide se propone el primero, y el usuario puede cambiarlo en el formulario de envío. */
function syncOrders(r){
  const prev = r.orders || [], groups = [];
  r.items.forEach(it => { const n = it.order?.number; if (!n) return;
    let g = groups.find(x => x.po === n); if (!g) groups.push(g = {po:n, sup:it.sup, items:0}); g.items++; });
  r.orders = groups.map(g => {
    const old = prev.find(o => o.po === g.po) || {};
    const kept = old.manual && r.files.find(f => f.file === old.file);
    const f = kept || r.files.find(x => x.file.includes(g.po)) || r.files[0] || {};
    return {...old, po:g.po, sup:g.sup, nItems:g.items, file:f.file || '', url:f.url, size:f.size, sent:!!r.sent[g.po]};
  });
}
const poTotal = (r, po) => r.items.filter(i => i.order?.number === po).reduce((a,i) => a + i.qty*i.price, 0);
const orderReady = r => r.items.every(it => it.order?.number) && r.files.length > 0;

function newSendItem(r, oi){
  const o = r.orders[oi], s = sup(o.sup);
  const item = {oi, lang:s.lang, langAuto:true,
    to: s.contacts.map(c => c.email),   // DECISIÓN D5
    cc: defaultCc(r)};
  if (!item.to.length && s.contacts[0]) item.to = [s.contacts[0].email];
  buildEmail(r, o, item);
  return item;
}

function locSummary(locs){

// Campo de destinatarios (chips + desplegable + escritura libre)
function chipField(kind, item, r, o){
  const vals = kind === 'to' ? item.to : item.cc.map(c => c.email);
  const chips = vals.map((e,j) => { const c = contactByEmail(e) || Object.values(USERS).find(u => u.email === e); const reason = kind==='cc' ? item.cc[j].reason : '';
    return `<span class="ec" title="${esc(c ? c.name + ' — ' + e : e)}${reason ? ' (' + esc(reason) + ')' : ''}"><span>${esc(e)}</span><button class="x" data-a="chipDel" data-k="${kind}" data-j="${j}">${ic('close')}</button></span>`; }).join('');
  let dd = '';
  if (S.dd === kind){
    const sids = reqSuppliers(r);
    // Solo los contactos del proveedor de esta OC (no se puede dirigir a otros proveedores)
    const groups = [[`Contactos de ${sup(o.sup).name}`, [o.sup]]];
    // Personal de ES Metals disponible para copia: todos los usuarios internos + Warehouse
    const internal = kind === 'cc' ? [...Object.values(USERS), {name:'Warehouse', email:WAREHOUSE, role:'Almacén'}] : [];
    dd = `<div class="dd">${kind==='cc' ? `<div class="g">Internos ES Metals</div>${internal.map(u => `<div class="o" data-a="ddPick" data-k="cc" data-e="${esc(u.email)}"><input type="checkbox" ${vals.includes(u.email)?'checked':''} tabindex="-1"><b>${esc(u.name)}</b><span class="em">${esc(u.email)}</span><span class="sp">${esc(u.role)}</span></div>`).join('')}` : ''}
      ${groups.filter(g => g[1].length).map(([g, ids]) => `<div class="g">${esc(g)}</div>${ids.map(id => sup(id).contacts.map(c => `<div class="o" data-a="ddPick" data-k="${kind}" data-e="${esc(c.email)}"><input type="checkbox" ${vals.includes(c.email)?'checked':''} tabindex="-1"><b>${esc(c.name)}</b><span class="em">${esc(c.email)}</span><span class="sp">${esc(c.role||'')}</span></div>`).join('')).join('')}`).join('')}</div>`;
  }
  return `<div class="chipfield dd-wrap" data-a="ddOpen" data-k="${kind}">${chips}<input id="in-${kind}" data-kd="${kind}" placeholder="${vals.length?'':'Seleccione o escriba un correo y presione Enter'}"><button class="caret" data-a="ddOpen" data-k="${kind}" tabindex="-1">${ic('down')}</button>${dd}</div>`;
}

function toast(msg, kind=''){
  const t = document.createElement('div'); t.className = `toast ${kind}`;
  t.innerHTML = `${ic(kind==='ok'?'check':'info')}<span>${msg}</span>`;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4200);
}
const topModal = () => S.modals[S.modals.length-1];
const sendModal = () => S.modals.find(m => m.type === 'send');
const curItem = () => { const m = sendModal(); return m.items[m.active]; };

function guardCfg(then){
  if (!S.cfgDirty) return then();
  openModal({type:'confirm', title:'Unsaved changes', text:'Hay cambios sin guardar en esta plantilla. ¿Desea descartarlos?', yes:'Discard', onYes:() => { S.cfgDirty = false; then(); }});
}
function addRecipient(kind, email){
  const it = curItem(); email = email.trim();
  if (!isEmail(email)) { toast(`"${esc(email)}" no es un correo válido`, 'warn'); return false; }
  // No se permite escribir el correo de un contacto de otro proveedor
  const r = req(S.reqId), o = r.orders[it.oi], owner = contactByEmail(email);
  if (owner && owner.sup.id !== o.sup) { toast(`${esc(email)} pertenece a ${esc(owner.sup.name)}; solo se puede enviar a contactos de ${esc(sup(o.sup).name)}`, 'warn'); return false; }
  if (kind === 'to'){ if (!it.to.some(e => e.toLowerCase() === email.toLowerCase())) it.to.push(email); }
  else if (!it.cc.some(c => c.email.toLowerCase() === email.toLowerCase())) it.cc.push({email, reason:''});
  return true;
}
function refreshGreeting(){
  // Si el usuario no editó el mensaje, regenerar para actualizar {{SUPPLIER_CONTACT}}
  const m = sendModal(), it = m.items[m.active], r = req(S.reqId);
  if (!it.edited) buildEmail(r, r.orders[it.oi], it);
}

    }, 1100);
  },
  successClose: () => { S.modals = []; render(); },
  successList: () => { S.modals = []; S.view = 'purchases'; render(); },
};

function markDirty(){ S.cfgDirty = true; const b = $('#cfgSave'); if (b) b.disabled = false; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!e.target.closest('.locdd')) document.querySelectorAll('.locdd.open').forEach(x => x.classList.remove('open'));
  if (S.dd &&!e.target.closest('.dd-wrap')) { S.dd = null; if (!el) { renderModals(); return; } }
  if (!el) return;
  if (el.tagName === 'BUTTON' || el.dataset.a === 'ddPick') e.preventDefault();
  A[el.dataset.a]?.(el, e);
});
document.addEventListener('mousedown', e => { if (e.target.closest('.toolbar button, .varpanel button')) e.preventDefault(); });

document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.i;
  if (t.closest('[data-ed]')) { markDirty(); return; }
  if (k === 'supQ'){ S.supQ = t.value; const pos = t.selectionStart; render(); const n = $('[data-i="supQ"]'); n.focus(); n.setSelectionRange(pos,pos); }
  if (k === 'closing'){ S.closingDraft = S.closingDraft || [...S.closing];
    // Solo se acepta una fecha dentro del mes de esa fila; se guarda el día
    const [yy, mm, dd] = (t.value || '').split('-').map(Number);
    S.closingDraft[+t.dataset.m] = (yy && mm - 1 === +t.dataset.m) ? dd : NaN;
    const v = S.closingDraft[+t.dataset.m]; t.classList.toggle('bad', !(v>=1 && v<=31));
    document.querySelectorAll('[data-a="closingSave"],[data-a="closingCancel"]').forEach(b => b.disabled = false); }
  if (k === 'poNum') $('#po-save').disabled = !($('#po-num').value.trim() && $('#po-due').value);
  if (k === 'subject') curItem().subject = t.value;
  if (k === 'msg'){ const it = curItem(); it.body = t.innerHTML; it.edited = true; }
});
// Archivos de OC elegidos desde el PC
function addOrderFiles(files){
  const r = req(S.reqId);
  [...files].forEach(f => {
    if (r.files.some(x => x.file === f.name)) return toast(`<b>${esc(f.name)}</b> ya está cargado`, 'warn');
    const kb = Math.max(1, Math.round(f.size / 1024));
    r.files.push({file:f.name, size:kb > 1024 ? (kb/1024).toFixed(1)+' MB' : kb+' KB', url:URL.createObjectURL(f)});
  });
  syncOrders(r); render();
  if (files.length) toast(`${files.length} archivo(s) cargado(s) en ORDERS`, 'ok');
}
document.addEventListener('change', e => {
  if (e.target.id === 'po-file') return addOrderFiles(e.target.files);
  const t = e.target, c = t.dataset.c; if (!c) return;
  if (c === 'sapOnly'){ S.sapOnly = t.checked; render(); }
  if (c === 'supActive'){ sup(S.selSup).active = t.checked; toast(`Proveedor ${t.checked?'activado':'desactivado'}`); }
  if (c === 'phoneCode'){ const f = t.closest('.cphone').querySelector('.flag'); f.className = 'flag ' + PHONE_CODES.find(p => p[0] === t.value)[1]; }
  if (c === 'cfgType'){ const v = t.value; guardCfg(() => { S.cfgType = v; render(); }); if (S.cfgDirty) t.checked = false; }
  if (c === 'fmtBlock'){ document.execCommand('formatBlock', false, t.value); markDirty(); }
  if (c === 'condEnabled'){ S.cfg[S.cfgType].conds[+t.dataset.k].enabled = t.checked;
    t.closest('tr').classList.toggle('off', !t.checked); t.closest('.cstate').querySelector('.lbl').textContent = t.checked ? 'Activo' : 'Inactivo'; }
  if (c === 'condDraftEnabled'){ S.condDraft.enabled = t.checked; t.closest('.cstate').querySelector('.lbl').textContent = t.checked ? 'Activo' : 'Inactivo'; }
  if (c === 'condLoc'){ const d = S.condDraft, l = t.value;
    d.locations = t.checked ? LOCATIONS.filter(x => x === l || d.locations.includes(x)) : d.locations.filter(x => x !== l);
    $('#locsum').textContent = locSummary(d.locations); }
  if (c === 'reqField'){ const r = req(S.reqId); r[t.dataset.f] = t.value; render();
    if (t.dataset.f === 'type') toast(`Tipo ${esc(t.value)}: se usará la plantilla ${esc(t.value)} y ${t.value==='Material'||t.value==='Asset'?'se copiará a':'no se copiará a'} ${WAREHOUSE}`); }
  if (c === 'selPO'){ const m = topModal(); m.sel = t.value === '' ? [] : [+t.value]; renderModals(); }
  if (c === 'poFile'){ const r = req(S.reqId), o = r.orders[+t.dataset.i], f = r.files.find(x => x.file === t.value);
    Object.assign(o, {file:f.file, url:f.url, size:f.size, manual:true}); renderModals(); }
});
document.addEventListener('keydown', e => {
  const k = e.target.dataset?.kd; if (!k) return;
  if ((e.key === 'Enter' || e.key === ',' || e.key === ';') && e.target.value.trim()){
    e.preventDefault(); if (addRecipient(k, e.target.value)) { if (k==='to') refreshGreeting(); S.focus = `#in-${k}`; renderModals(); }
  } else if (e.key === 'Backspace' && !e.target.value){
    const it = curItem(); k === 'to' ? it.to.pop() : it.cc.pop(); if (k==='to') refreshGreeting(); S.focus = `#in-${k}`; renderModals();
  } else if (e.key === 'Escape'){ S.dd = null; renderModals(); }
});
// Recordar el último editor y posición del cursor (para insertar variables)
document.addEventListener('focusin', e => { const ed = e.target.closest?.('[data-ed]'); if (ed) S.lastEd = ed.id; });
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection(); if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0), ed = r.startContainer.parentElement?.closest?.('[data-ed]') || (r.startContainer.closest && r.startContainer.closest('[data-ed]'));
  if (ed) { S.lastEd = ed.id; S.lastRange = r.cloneRange(); }
});

S.reqs.forEach(syncOrders);
render();
</script>
</body>
</html>
